name: Android recording startup
on:
  pull_request:
    paths:
      - 'android/**'
      - 'nitrogen/generated/android/**'
      - 'example/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/android-startup.yml'
  workflow_dispatch: {}

jobs:
  android-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: corepack enable
      - run: yarn install --immutable
      - name: Generate the example Android project
        working-directory: example
        run: yarn expo prebuild --platform android --no-install
      - name: Compile the native module and test recording recovery
        working-directory: example/android
        run: ./gradlew :react-native-nitro-screen-recorder:testDebugUnitTest --no-daemon -PreactNativeArchitectures=x86_64
